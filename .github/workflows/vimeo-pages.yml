# Install as .github/workflows/vimeo-pages.yml in the generated-site repository.
name: Sincronizar Vimeo y publicar CLEMIVERSE
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: clemiverse-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Actualizar títulos y miniaturas de Vimeo
        id: sync
        run: |
          node .github/scripts/sync-vimeo.mjs data/vimeo-videos.json .github/config/vimeo-library.json
          if git diff --quiet -- data/vimeo-videos.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/vimeo-videos.json
            git commit -m 'Actualizar catálogo y miniaturas de Vimeo'
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v4
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: '.'
      - name: Publicar CLEMIVERSE
        id: deployment
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
